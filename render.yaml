# Render Blueprint для «Фабрика Игр»
# Docs: https://render.com/docs/blueprint-spec
#
# ВАЖНО: persistent disk доступен только на платных инстансах (Starter и выше).
# На free-плане Render диск подключить нельзя, и данные будут теряться при
# каждом рестарте/деплое. Если диск не нужен — удалите секцию disk и DATA_DIR.
# На Free вместо диска работают снапшоты в Cloudflare R2 (переменные R2_* ниже).

services:
  - type: web
    name: game-factory-bot
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: gamefactory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATA_DIR
        value: /var/data
      - key: DB_FILE
        value: /var/data/gamefactory.db
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: ADMIN_IDS
        value: "6430160880"
      - key: START_FREE_GAMES
        value: "2"
      - key: MAX_GENERATIONS_PER_DAY
        value: "20"
      - key: GENERATION_COOLDOWN_MS
        value: "30000"
      - key: REFERRALS_PER_MONTH
        value: "10"
      - key: GEMINI_SAFETY_THRESHOLD
        value: BLOCK_MEDIUM_AND_ABOVE
      - key: GEMINI_DANGEROUS_THRESHOLD
        value: BLOCK_ONLY_HIGH
      - key: GEMINI_MODEL_CHAIN
        value: "gemini-2.5-flash,gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.5-flash"
      - key: GEMINI_CRITIC_MODEL_CHAIN
        value: "gemini-2.5-flash,gemini-3.8-flash,gemini-3.5-flash,gemini-3.5-flash-lite"
      - key: GEMINI_MIN_INTERVAL_MS
        value: "4000"
      - key: GEMINI_MAX_ATTEMPTS
        value: "3"
      - key: QUALITY_CRITIC_ENABLED
        value: "true"
      - key: QUALITY_CRITIC_MIN_SCORE
        value: "80"
      - key: QUALITY_POLISH_ENABLED
        value: "true"
      - key: CANVAS_BLANK_AUTOHIDE
        value: "true"
      - key: ALLOW_UNMODERATED_IMAGE_UPLOADS
        value: "false"
      # Webhook включается автоматически на Render с HTTPS-доменом.
      - key: BOT_MODE
        value: webhook
      - key: BOT_HANDLER_TIMEOUT_MS
        value: "300000"
      - key: WEBHOOK_MAX_QUEUE
        value: "100"
      # Снапшоты данных в R2: на Free постоянного диска нет.
      - key: R2_PREFIX
        value: gamefactory/
      - key: SNAPSHOT_INTERVAL_MS
        value: "60000"
      - key: SNAPSHOT_TIMEOUT_MS
        value: "20000"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Альтернатива без S3-ключей: Supabase Storage по service-ключу.
      - key: SNAPSHOT_PROVIDER
        sync: false
      - key: SNAPSHOT_BUCKET
        sync: false
      - key: SNAPSHOT_URL
        sync: false
      - key: SNAPSHOT_SERVICE_KEY
        sync: false
      # Секреты и URL-ы задаются в Dashboard (sync: false).
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: VISUAL_TOKEN_SECRET
        generateValue: true
      - key: SIGHT_USER
        sync: false
      - key: SIGHT_SECRET
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: WELCOME_IMAGE_URL
        sync: false
      - key: GAMES_PUBLIC_URL
        sync: false
      - key: COMMUNITY_URL
        sync: false
      # Реквизиты для юридических документов: подставляются в legal/*.md вместо [email] и т. п.
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_INN
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_PAYMENT_DETAILS
        sync: false
      - key: CONTRACT_DATE
        sync: false
      - key: CONTRACT_NUMBER
        sync: false
      - key: REFUND_PERIOD_DAYS
        sync: false
