name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check
        run: |
          status=0
          for file in $(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*'); do
            node --check "$file" || status=1
          done
          exit $status
      - name: Tests
        run: npm test
