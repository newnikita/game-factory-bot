<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Runner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; outline: none; }
        body, html {
            width: 100%; height: 100%; position: fixed; overflow: hidden;
            background: url('https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=1080&auto=format&fit=crop') center/cover no-repeat;
            display: flex; justify-content: center; align-items: center;
            font-family: "Electrolize", sans-serif; /* Fallback to a common sans-serif */
            color: white;
        }
        canvas {
            display: block;
            background: rgba(0, 0, 0, 0.4);
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width, height;

    let lastTime = 0;
    let gameState = 'MENU'; // MENU, PLAYING, PAUSED, GAME_OVER, WIN
    let score = 0;
    let combo = 0;
    let comboTimer = 0;
    let gameTimer = 0;
    const GAME_DURATION_SECONDS = 60;

    let shakeOffset = { x: 0, y: 0 };
    let shakeDuration = 0;

    const GRAVITY = 0.5;
    const JUMP_FORCE = -12;
    const PLAYER_RUN_SPEED = 6;
    const PLAYER_SLIDE_DURATION = 0.8; // seconds

    // Cached offscreen canvases and gradients
    const offscreenCanvas = new OffscreenCanvas(1, 1); // dummy, will be resized
    const offscreenCtx = offscreenCanvas.getContext('2d');
    const playerSpriteCache = new Map();
    const coinSpriteCache = new Map();
    const antennaSpriteCache = new Map();
    let roofGradientCache = null;

    // --- Object Pools ---
    const rainPool = [];
    const sparkPool = [];
    const maxRainParticles = 80;
    const maxSparks = 40;

    class RainParticle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = -2 - Math.random() * 3;
            this.vy = 5 + Math.random() * 5;
            this.length = 10 + Math.random() * 15;
            this.alpha = 0.3 + Math.random() * 0.4;
        }
        update(dt) {
            this.x += this.vx * dt * 60;
            this.y += this.vy * dt * 60;
            if (this.y > height || this.x < 0) {
                this.reset();
                this.y = -this.length; // Start from top
                this.x = Math.random() * width * 1.5; // Wider spawn area
            }
        }
        draw() {
            ctx.strokeStyle = `rgba(173, 216, 230, ${this.alpha})`;
            ctx.lineWidth = 1 * dpr;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + this.vx * 0.5, this.y + this.length);
            ctx.stroke();
        }
    }

    class SparkParticle {
        constructor() {
            this.reset();
        }
        reset() {
            this.active = false;
            this.x = 0; this.y = 0;
            this.vx = 0; this.vy = 0;
            this.life = 0; this.maxLife = 0;
            this.size = 0;
            this.color = '255, 255, 200';
        }
        spawn(x, y, color = '255, 255, 200') {
            this.active = true;
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8;
            this.life = 0;
            this.maxLife = 0.3 + Math.random() * 0.5; // seconds
            this.size = 2 + Math.random() * 3;
            this.color = color;
        }
        update(dt) {
            if (!this.active) return;
            this.x += this.vx * dt * 60;
            this.y += this.vy * dt * 60;
            this.vy += GRAVITY * 0.5 * dt * 60; // Light gravity for sparks
            this.life += dt;
            if (this.life >= this.maxLife) {
                this.active = false;
            }
        }
        draw() {
            if (!this.active) return;
            const alpha = 1 - (this.life / this.maxLife);
            ctx.fillStyle = `rgba(${this.color}, ${alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * dpr, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function getRainParticle() {
        for (let i = 0; i < rainPool.length; i++) {
            if (!rainPool[i].active) {
                rainPool[i].reset();
                rainPool[i].active = true;
                return rainPool[i];
            }
        }
        if (rainPool.length < maxRainParticles) {
            const p = new RainParticle();
            p.active = true;
            rainPool.push(p);
            return p;
        }
        return null;
    }

    function getSparkParticle() {
        for (let i = 0; i < sparkPool.length; i++) {
            if (!sparkPool[i].active) {
                return sparkPool[i];
            }
        }
        if (sparkPool.length < maxSparks) {
            const p = new SparkParticle();
            sparkPool.push(p);
            return p;
        }
        return null;
    }

    // --- Game Objects ---
    const player = {
        x: 0, y: 0,
        width: 30, height: 40,
        baseY: 0,
        vx: PLAYER_RUN_SPEED, vy: 0,
        isJumping: false,
        isSliding: false,
        slideTimer: 0,
        draw() {
            const cacheKey = `${this.isSliding ? 'slide' : 'run'}`;
            let sprite = playerSpriteCache.get(cacheKey);

            if (!sprite) {
                offscreenCanvas.width = this.width * dpr * 1.5;
                offscreenCanvas.height = this.height * dpr * 1.5;
                offscreenCtx.scale(dpr, dpr);
                offscreenCtx.clearRect(0, 0, offscreenCanvas.width / dpr, offscreenCanvas.height / dpr);

                offscreenCtx.shadowColor = 'rgba(0, 255, 255, 0.8)';
                offscreenCtx.shadowBlur = 15;

                const bodyWidth = this.width * 0.7;
                const bodyHeight = this.height * (this.isSliding ? 0.5 : 0.8);
                const headRadius = this.width * 0.3;

                offscreenCtx.fillStyle = '#00FFFF'; // Neon Cyan
                offscreenCtx.beginPath();
                if (this.isSliding) {
                    offscreenCtx.roundRect(0, this.height * 0.5, bodyWidth, bodyHeight, 5);
                } else {
                    offscreenCtx.roundRect(0, headRadius, bodyWidth, bodyHeight, 8);
                    offscreenCtx.arc(bodyWidth / 2, headRadius, headRadius, 0, Math.PI * 2);
                }
                offscreenCtx.fill();

                sprite = document.createElement('canvas'); // Use real canvas for caching
                sprite.width = offscreenCanvas.width;
                sprite.height = offscreenCanvas.height;
                sprite.getContext('2d').drawImage(offscreenCanvas, 0, 0);
                playerSpriteCache.set(cacheKey, sprite);
            }
            ctx.drawImage(sprite, this.x - this.width * 0.25, this.y - this.height * 0.25, sprite.width / dpr, sprite.height / dpr);
        },
        update(dt) {
            if (this.isSliding) {
                this.slideTimer -= dt;
                if (this.slideTimer <= 0) {
                    this.isSliding = false;
                    this.height = 40; // Reset height
                }
            }

            this.vy += GRAVITY;
            this.y += this.vy;

            if (this.y >= this.baseY - this.height) {
                this.y = this.baseY - this.height;
                this.vy = 0;
                this.isJumping = false;
            }
        },
        jump() {
            if (!this.isJumping && !this.isSliding) {
                this.vy = JUMP_FORCE;
                this.isJumping = true;
            }
        },
        slide() {
            if (!this.isSliding && !this.isJumping) {
                this.isSliding = true;
                this.slideTimer = PLAYER_SLIDE_DURATION;
                this.height = 20; // Reduce height for sliding
            }
        }
    };

    class Platform {
        constructor(x, y, width) {
            this.x = x;
            this.y = y;
            this.width = width;
            this.height = 20;
            this.color = '#008080'; // Teal base
        }
        draw() {
            if (!roofGradientCache) {
                roofGradientCache = ctx.createLinearGradient(0, this.y, 0, this.y + this.height);
                roofGradientCache.addColorStop(0, '#008080');
                roofGradientCache.addColorStop(0.5, '#00AAAA');
                roofGradientCache.addColorStop(1, '#006666');
            }
            ctx.fillStyle = roofGradientCache;
            ctx.shadowColor = 'rgba(0, 255, 255, 0.5)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.roundRect(this.x, this.y, this.width, this.height, 5);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Simple reflection effect
            ctx.fillStyle = `rgba(0, 255, 255, 0.1)`;
            ctx.beginPath();
            ctx.roundRect(this.x + 5, this.y + 5, this.width - 10, this.height * 0.4, 3);
            ctx.fill();
        }
    }

    class Coin {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 8;
            this.active = true;
            this.rotation = 0;
        }
        draw() {
            if (!this.active) return;
            let sprite = coinSpriteCache.get('coin');
            if (!sprite) {
                const size = this.radius * 2 * dpr * 1.5;
                offscreenCanvas.width = size;
                offscreenCanvas.height = size;
                offscreenCtx.scale(dpr, dpr);
                offscreenCtx.clearRect(0, 0, size / dpr, size / dpr);

                offscreenCtx.shadowColor = 'rgba(255, 255, 0, 0.8)';
                offscreenCtx.shadowBlur = 10;
                offscreenCtx.fillStyle = '#FFFF00'; // Neon Yellow
                offscreenCtx.beginPath();
                offscreenCtx.arc(this.radius, this.radius, this.radius, 0, Math.PI * 2);
                offscreenCtx.fill();

                sprite = document.createElement('canvas');
                sprite.width = offscreenCanvas.width;
                sprite.height = offscreenCanvas.height;
                sprite.getContext('2d').drawImage(offscreenCanvas, 0, 0);
                coinSpriteCache.set('coin', sprite);
            }

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.drawImage(sprite, -sprite.width / (2 * dpr), -sprite.height / (2 * dpr), sprite.width / dpr, sprite.height / dpr);
            ctx.restore();
        }
        update(dt) {
            if (!this.active) return;
            this.rotation += 5 * dt; // Rotate 5 radians per second
            this.x -= player.vx * dt;
            if (this.x + this.radius < 0) this.active = false;
        }
    }

    class Antenna {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = 15;
            this.height = 60;
            this.active = true;
        }
        draw() {
            if (!this.active) return;
            let sprite = antennaSpriteCache.get('antenna');
            if (!sprite) {
                const renderWidth = this.width * dpr * 1.5;
                const renderHeight = this.height * dpr * 1.5;
                offscreenCanvas.width = renderWidth;
                offscreenCanvas.height = renderHeight;
                offscreenCtx.scale(dpr, dpr);
                offscreenCtx.clearRect(0, 0, renderWidth / dpr, renderHeight / dpr);

                offscreenCtx.shadowColor = 'rgba(255, 0, 255, 0.8)';
                offscreenCtx.shadowBlur = 10;
                offscreenCtx.fillStyle = '#FF00FF'; // Neon Magenta

                offscreenCtx.beginPath();
                offscreenCtx.roundRect(0, 0, this.width, this.height, 5);
                offscreenCtx.fill();

                offscreenCtx.beginPath();
                offscreenCtx.arc(this.width / 2, 0, this.width / 2 + 3, 0, Math.PI, true);
                offscreenCtx.fill(); // Top dome part

                sprite = document.createElement('canvas');
                sprite.width = offscreenCanvas.width;
                sprite.height = offscreenCanvas.height;
                sprite.getContext('2d').drawImage(offscreenCanvas, 0, 0);
                antennaSpriteCache.set('antenna', sprite);
            }
            ctx.drawImage(sprite, this.x - this.width * 0.25, this.y - this.height * 0.25, sprite.width / dpr, sprite.height / dpr);
        }
        update(dt) {
            if (!this.active) return;
            this.x -= player.vx * dt;
            if (this.x + this.width < 0) this.active = false;
        }
    }

    class ParallaxLayer {
        constructor(imageSrc, speedRatio, baseColor, zIndex) {
            this.x = 0;
            this.image = null; // Will be generated procedurally
            this.speedRatio = speedRatio;
            this.baseColor = baseColor;
            this.zIndex = zIndex; // For drawing order
            this.generateImage();
        }

        generateImage() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width * 2; // Twice the screen width
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');

            tempCtx.fillStyle = this.baseColor;
            tempCtx.shadowColor = `rgba(0, 255, 255, 0.3)`;
            tempCtx.shadowBlur = 5;

            for (let i = 0; i < 20; i++) { // Draw some random buildings/shapes
                const buildingWidth = 50 + Math.random() * 150;
                const buildingHeight = height * (0.2 + Math.random() * 0.4 * this.speedRatio);
                const buildingX = Math.random() * tempCanvas.width;
                const buildingY = height - buildingHeight;

                tempCtx.beginPath();
                tempCtx.roundRect(buildingX, buildingY, buildingWidth, buildingHeight, 5);
                tempCtx.fill();

                if (this.speedRatio > 0.5) { // Add windows for closer buildings
                    tempCtx.fillStyle = `rgba(255, 255, 0, 0.5)`;
                    tempCtx.shadowColor = `rgba(255, 255, 0, 0.5)`;
                    tempCtx.shadowBlur = 3;
                    for (let wx = 0; wx < buildingWidth; wx += 20 + Math.random() * 10) {
                        for (let wy = 0; wy < buildingHeight - 20; wy += 20 + Math.random() * 10) {
                            if (Math.random() > 0.6) {
                                tempCtx.fillRect(buildingX + wx + 5, buildingY + wy + 5, 8, 8);
                            }
                        }
                    }
                    tempCtx.shadowBlur = 0;
                }
            }
            this.image = tempCanvas;
        }

        update(dt) {
            this.x -= player.vx * this.speedRatio * dt;
            if (this.x <= -this.image.width / 2) {
                this.x += this.image.width / 2;
            }
        }

        draw() {
            ctx.drawImage(this.image, this.x, 0, this.image.width, this.image.height);
            ctx.drawImage(this.image, this.x + this.image.width / 2, 0, this.image.width, this.image.height);
        }
    }


    let platforms = [];
    let coins = [];
    let obstacles = [];
    let parallaxLayers = [];

    // --- Game Logic ---
    function setupGame() {
        width = canvas.clientWidth * dpr;
        height = canvas.clientHeight * dpr;
        canvas.width = width;
        canvas.height = height;
        ctx.scale(dpr, dpr);

        player.x = width / (2 * dpr) - player.width / 2;
        player.baseY = height / dpr - 50;
        player.y = player.baseY - player.height;

        roofGradientCache = null; // Invalidate cache on resize

        // Re-initialize parallax layers
        parallaxLayers = [
            new ParallaxLayer(null, 0.1, 'rgba(0, 0, 50, 0.6)', 1), // Distant city (darker, slower)
            new ParallaxLayer(null, 0.3, 'rgba(0, 0, 80, 0.7)', 2), // Mid-ground buildings
            new ParallaxLayer(null, 0.6, 'rgba(0, 0, 120, 0.8)', 3) // Closer buildings
        ].sort((a, b) => a.zIndex - b.zIndex);

        // Pre-fill rain pool
        for (let i = 0; i < maxRainParticles; i++) {
            rainPool.push(new RainParticle());
        }
        // Pre-fill spark pool
        for (let i = 0; i < maxSparks; i++) {
            sparkPool.push(new SparkParticle());
        }
    }

    function initGame() {
        score = 0;
        combo = 0;
        comboTimer = 0;
        gameTimer = 0;
        player.x = width / (2 * dpr) - player.width / 2;
        player.y = player.baseY - player.height;
        player.vx = PLAYER_RUN_SPEED;
        player.vy = 0;
        player.isJumping = false;
        player.isSliding = false;

        platforms = [];
        coins = [];
        obstacles = [];

        // Initial platform under player
        platforms.push(new Platform(player.x - 50, player.baseY, player.width + 100));

        let currentX = platforms[0].x + platforms[0].width + 100;
        while (currentX < width / dpr + 300) {
            generateNextSection(currentX);
            currentX += (platforms[platforms.length - 1].width + Math.random() * 80 + 100);
        }
    }

    function generateNextSection(startX) {
        const minGap = 80;
        const maxGap = 200;
        const platformWidth = 100 + Math.random() * 150;
        const platformY = player.baseY;

        const gap = minGap + Math.random() * (maxGap - minGap);
        const newPlatformX = startX + gap;
        platforms.push(new Platform(newPlatformX, platformY, platformWidth));

        // Add coins
        if (Math.random() > 0.5) {
            const coinCount = Math.floor(2 + Math.random() * 4);
            for (let i = 0; i < coinCount; i++) {
                coins.push(new Coin(newPlatformX + platformWidth * 0.1 + i * 30, platformY - 50 - Math.random() * 20));
            }
        }

        // Add antenna obstacle
        if (Math.random() > 0.6 && platformWidth > 120) {
            obstacles.push(new Antenna(newPlatformX + platformWidth * 0.3 + Math.random() * (platformWidth * 0.4), platformY - 60));
        }
    }

    function updateGame(dt) {
        if (gameState === 'PAUSED') return;

        gameTimer += dt;
        if (gameTimer >= GAME_DURATION_SECONDS) {
            endGame(true); // Win condition
            return;
        }

        player.update(dt);

        // Update parallax layers
        parallaxLayers.forEach(layer => layer.update(dt));

        // Update and filter platforms
        platforms = platforms.filter(p => {
            p.x -= player.vx * dt;
            return p.x + p.width > 0;
        });
        // Generate new platforms
        if (platforms.length === 0 || platforms[platforms.length - 1].x < width / dpr - 200) {
            generateNextSection(platforms.length > 0 ? platforms[platforms.length - 1].x + platforms[platforms.length - 1].width : width / dpr);
        }

        // Update and filter coins
        coins.forEach(coin => coin.update(dt));
        coins = coins.filter(coin => coin.active);

        // Update and filter obstacles
        obstacles.forEach(obstacle => obstacle.update(dt));
        obstacles = obstacles.filter(obstacle => obstacle.active);

        // Collision detection: Player with platforms
        let onPlatform = false;
        for (let p of platforms) {
            if (player.vy >= 0 && // Only check if falling
                player.x + player.width * 0.8 > p.x &&
                player.x + player.width * 0.2 < p.x + p.width &&
                player.y + player.height >= p.y &&
                player.y + player.height <= p.y + p.height / 2) { // Landed slightly on top
                player.y = p.y - player.height;
                player.vy = 0;
                player.isJumping = false;
                onPlatform = true;
                break;
            }
        }
        if (!onPlatform && player.y + player.height > player.baseY + 50) { // Fall off screen
            endGame(false);
        }

        // Collision detection: Player with coins
        for (let i = coins.length - 1; i >= 0; i--) {
            const coin = coins[i];
            if (coin.active &&
                player.x < coin.x + coin.radius &&
                player.x + player.width > coin.x - coin.radius &&
                player.y < coin.y + coin.radius &&
                player.y + player.height > coin.y - coin.radius) {
                coin.active = false;
                score += 10 + combo * 5;
                combo++;
                comboTimer = 2; // Combo lasts 2 seconds
                for (let k = 0; k < 5; k++) {
                    const spark = getSparkParticle();
                    if (spark) spark.spawn(coin.x, coin.y, '255, 255, 0');
                }
            }
        }

        // Combo timer
        if (combo > 0) {
            comboTimer -= dt;
            if (comboTimer <= 0) {
                combo = 0;
            }
        }

        // Collision detection: Player with antennas
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const antenna = obstacles[i];
            const playerHitboxY = player.isSliding ? player.y + player.height * 0.5 : player.y;
            const playerHitboxHeight = player.isSliding ? player.height * 0.5 : player.height;

            if (antenna.active &&
                player.x + player.width * 0.8 > antenna.x &&
                player.x + player.width * 0.2 < antenna.x + antenna.width &&
                playerHitboxY < antenna.y + antenna.height &&
                playerHitboxY + playerHitboxHeight > antenna.y) {
                antenna.active = false; // Antenna disappears after hit
                combo = 0; // Break combo
                score = Math.max(0, score - 50); // Penalty
                triggerScreenShake(0.3, 5); // Shake screen
                for (let k = 0; k < 10; k++) {
                    const spark = getSparkParticle();
                    if (spark) spark.spawn(antenna.x + antenna.width / 2, antenna.y + antenna.height / 2, '255, 0, 0');
                }
            }
        }

        // Update rain particles
        rainPool.forEach(p => p.update(dt));
        // Update spark particles
        sparkPool.forEach(p => p.update(dt));

        // Update screen shake
        if (shakeDuration > 0) {
            shakeDuration -= dt;
            shakeOffset.x = (Math.random() - 0.5) * 2 * shakeDuration * 10;
            shakeOffset.y = (Math.random() - 0.5) * 2 * shakeDuration * 10;
        } else {
            shakeOffset.x = 0;
            shakeOffset.y = 0;
        }
    }

    function drawGame() {
        ctx.clearRect(0, 0, width / dpr, height / dpr);

        ctx.save();
        ctx.translate(shakeOffset.x, shakeOffset.y);

        // Draw parallax layers
        parallaxLayers.forEach(layer => layer.draw());

        // Draw platforms
        platforms.forEach(p => p.draw());

        // Draw coins
        coins.forEach(c => c.draw());

        // Draw obstacles (antennas)
        obstacles.forEach(o => o.draw());

        // Draw player
        player.draw();

        // Draw rain particles
        rainPool.forEach(p => p.draw());

        // Draw spark particles
        sparkPool.forEach(p => p.draw());

        // Draw UI
        ctx.font = `bold ${24 * dpr}px 'Electrolize', sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = 'rgba(0, 255, 255, 0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText(`Score: ${Math.floor(score)}`, 20, 40);
        ctx.fillText(`Time: ${Math.floor(GAME_DURATION_SECONDS - gameTimer)}s`, 20, 70);
        if (combo > 0) {
            ctx.fillStyle = '#FFFF00';
            ctx.fillText(`Combo: x${combo}`, 20, 100);
        }
        ctx.shadowBlur = 0;

        ctx.restore();

        // Draw state-specific overlays
        if (gameState === 'MENU') {
            drawOverlay('NEON RUNNER', 'Tap to Jump, Swipe Down to Slide', 'Tap to Play');
        } else if (gameState === 'PAUSED') {
            drawOverlay('PAUSED', '', 'Tap to Resume');
        } else if (gameState === 'GAME_OVER') {
            drawOverlay('GAME OVER', `Score: ${Math.floor(score)}`, 'Tap to Restart');
        } else if (gameState === 'WIN') {
            drawOverlay('YOU SURVIVED!', `Final Score: ${Math.floor(score)}`, 'Tap to Restart');
        }
    }

    function drawOverlay(title, subtitle, actionText) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, width / dpr, height / dpr);

        ctx.shadowColor = 'rgba(0, 255, 255, 1)';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#00FFFF';
        ctx.font = `bold ${48 * dpr}px 'Electrolize', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(title, width / (2 * dpr), height / (2 * dpr) - 50);

        ctx.shadowColor = 'rgba(255, 255, 0, 0.8)';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#FFFF00';
        ctx.font = `bold ${24 * dpr}px 'Electrolize', sans-serif`;
        ctx.fillText(subtitle, width / (2 * dpr), height / (2 * dpr) + 10);

        ctx.shadowColor = 'rgba(0, 255, 0, 0.8)';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#00FF00';
        ctx.font = `bold ${32 * dpr}px 'Electrolize', sans-serif`;
        ctx.fillText(actionText, width / (2 * dpr), height / (2 * dpr) + 100);
        ctx.shadowBlur = 0;
    }

    function gameLoop(time) {
        requestAnimationFrame(gameLoop);

        const dt = Math.min((time - lastTime) / 1000, 1 / 30); // Cap delta time for stability
        lastTime = time;

        if (gameState === 'PLAYING') {
            updateGame(dt);
        }
        drawGame();
    }

    function startGame() {
        gameState = 'PLAYING';
        initGame();
    }

    function pauseGame() {
        if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
        } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
        }
    }

    function endGame(isWin) {
        gameState = isWin ? 'WIN' : 'GAME_OVER';
    }

    function restartGame() {
        startGame();
    }

    function triggerScreenShake(duration, intensity) {
        shakeDuration = duration;
        shakeOffset.x = intensity;
        shakeOffset.y = intensity;
    }

    // --- Input Handling (Touch ONLY) ---
    let touchStartX = 0;
    let touchStartY = 0;
    let touchMoved = false;

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchMoved = false;
        }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            const deltaX = e.touches[0].clientX - touchStartX;
            const deltaY = e.touches[0].clientY - touchStartY;
            if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) { // Threshold for movement
                touchMoved = true;
            }
        }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;

        if (gameState === 'MENU' || gameState === 'GAME_OVER' || gameState === 'WIN') {
            startGame();
            return;
        }
        if (gameState === 'PAUSED') {
            pauseGame();
            return;
        }

        if (!touchMoved) { // Tap
            player.jump();
        } else { // Swipe
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaY) > Math.abs(deltaX) && deltaY > 0) { // Swipe down
                player.slide();
            }
        }
    }, { passive: false });

    // --- Window Resizing ---
    window.addEventListener('resize', setupGame);

    // Initial setup and start game loop
    setupGame();
    gameLoop(0);

</script>
